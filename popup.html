<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>驗證碼自動填入</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #18181b;
      --muted: #71717a;
      --faint: #a1a1aa;
      --line: #ececef;
      --accent: #7c246c;
      --accent-hover: #6a1e5c;
      --accent-soft: #f7eff5;
      --accent-line: rgba(124, 36, 108, 0.16);
      --on-accent: #ffffff;
      --switch-off: #d4d4d8;
      --field: #ffffff;
      --field-border: #d4d4d8;
      --ok: #15803d;
      --warn: #b45309;
      --error: #dc2626;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1f;
        --text: #ededf0;
        --muted: #a1a1aa;
        --faint: #71717a;
        --line: #2c2c31;
        --accent: #c56aae;
        --accent-hover: #d17fbc;
        --accent-soft: #2a1d27;
        --accent-line: rgba(197, 106, 174, 0.22);
        --on-accent: #1c1c1f;
        --switch-off: #3f3f46;
        --field: #232327;
        --field-border: #3f3f46;
        --ok: #4ade80;
        --warn: #fbbf24;
        --error: #f87171;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft JhengHei UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.45;
      border-top: 3px solid var(--accent);
      user-select: none;
    }

    button {
      font: inherit;
      color: inherit;
    }

    [hidden] {
      display: none !important;
    }

    /* Header */
    .head {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 15px;
      background: var(--accent-soft);
      border-bottom: 1px solid var(--line);
    }
    .head .noise {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      color: var(--accent-line);
      pointer-events: none;
    }
    .brand {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      position: relative;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--accent);
      color: var(--on-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .logo span {
      display: inline-block;
      font-size: 16px;
      font-weight: 700;
    }
    .logo .glyph-a {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      transform: rotate(-12deg) translateY(1px);
    }
    .logo .glyph-z {
      font-family: "Courier New", monospace;
      transform: rotate(9deg) translateY(-1px);
    }
    .logo .strike {
      position: absolute;
      left: 3px;
      right: 3px;
      top: 52%;
      height: 1.5px;
      background: currentColor;
      opacity: 0.75;
      transform: rotate(-14deg);
    }
    h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .subtitle {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 1px;
    }
    .count {
      position: relative;
      text-align: right;
    }
    .count-num {
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 26px;
      font-weight: 600;
      line-height: 1;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .count-unit {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
    }

    /* Settings rows */
    .body {
      padding: 2px 20px 14px;
    }
    .group {
      border-bottom: 1px solid var(--line);
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 11px 0;
    }
    .row + .row {
      border-top: 1px solid var(--line);
    }
    .label {
      font-size: 13.5px;
    }
    .desc {
      font-size: 12px;
      color: var(--muted);
      margin-top: 1px;
    }

    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 20px;
      flex-shrink: 0;
    }
    .switch input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
      z-index: 1;
    }
    .slider {
      position: absolute;
      inset: 0;
      background: var(--switch-off);
      border-radius: 10px;
      transition: background-color 0.2s ease;
    }
    .slider::before {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s ease;
    }
    .switch input:checked + .slider {
      background: var(--accent);
    }
    .switch input:checked + .slider::before {
      transform: translateX(14px);
    }
    .switch input:focus-visible + .slider {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Auto login details */
    .saved {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      font-size: 12.5px;
      color: var(--muted);
      background: var(--accent-soft);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 10px;
    }
    .saved-account {
      font-weight: 600;
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      margin-left: 6px;
      user-select: text;
    }
    .link {
      background: none;
      border: 0;
      padding: 0;
      color: var(--accent);
      font-size: 12.5px;
      cursor: pointer;
    }
    .link:hover {
      text-decoration: underline;
    }
    .link.danger {
      color: var(--muted);
    }
    .link.danger:hover {
      color: var(--error);
    }

    .form {
      padding-bottom: 4px;
    }
    .field {
      margin-bottom: 10px;
    }
    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .input {
      width: 100%;
      height: 32px;
      padding: 0 10px;
      border: 1px solid var(--field-border);
      border-radius: 6px;
      background: var(--field);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      user-select: text;
    }
    .input::placeholder {
      color: var(--faint);
    }
    .input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .password-wrapper {
      position: relative;
    }
    .password-wrapper .input {
      padding-right: 34px;
    }
    .eye-btn {
      position: absolute;
      top: 0;
      right: 0;
      width: 32px;
      height: 32px;
      background: none;
      border: 0;
      color: var(--faint);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .eye-btn:hover {
      color: var(--text);
    }
    .form-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .btn-outline {
      height: 30px;
      padding: 0 16px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: transparent;
      color: var(--accent);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-outline:hover {
      background: var(--accent-soft);
    }
    .form-actions .secondary {
      display: flex;
      gap: 14px;
    }

    .note {
      font-size: 11.5px;
      color: var(--faint);
      padding-bottom: 12px;
    }

    .status {
      font-size: 12px;
      min-height: 0;
    }
    .status:empty {
      display: none;
    }
    .status.ok { color: var(--ok); }
    .status.warn { color: var(--warn); }
    .status.error { color: var(--error); }
    .status.info { color: var(--muted); }
    #loginStatusMessage {
      padding-bottom: 10px;
    }

    /* Primary action */
    .btn-primary {
      width: 100%;
      height: 36px;
      margin-top: 16px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: var(--on-accent);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    .btn-primary:active {
      transform: translateY(1px);
    }
    #statusMessage {
      margin-top: 8px;
      text-align: center;
    }

    .foot {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 12px;
      font-size: 11.5px;
      color: var(--faint);
    }
    .foot .link {
      font-size: 11.5px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header class="head">
    <svg class="noise" viewBox="0 0 320 70" preserveAspectRatio="none" aria-hidden="true">
      <path fill="none" stroke="currentColor" stroke-width="1.2" d="M-10 52 C 60 20, 120 70, 190 34 S 300 10, 340 40"/>
      <path fill="none" stroke="currentColor" stroke-width="1.2" d="M-10 18 C 50 40, 140 4, 210 30 S 290 64, 340 22"/>
      <path fill="none" stroke="currentColor" stroke-width="1.2" d="M150 70 C 190 40, 240 60, 340 6"/>
    </svg>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <span class="glyph-a">a</span><span class="glyph-z">Z</span><i class="strike"></i>
      </div>
      <div>
        <h1>驗證碼自動填入</h1>
        <div class="subtitle">清大校務・eeclass・其他網站</div>
      </div>
    </div>
    <div class="count" title="累計自動填入次數">
      <div class="count-num" id="statsCount">0</div>
      <div class="count-unit">次</div>
    </div>
  </header>

  <main class="body">
    <section class="group">
      <div class="row">
        <div>
          <div class="label">自動填入驗證碼</div>
          <div class="desc">關閉後所有網站都不會自動填入</div>
        </div>
        <label class="switch" aria-label="自動填入驗證碼">
          <input type="checkbox" id="autoFillToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="row">
        <div class="label">其他網站也自動填入</div>
        <label class="switch" aria-label="其他網站也自動填入">
          <input type="checkbox" id="universalToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <section class="group">
      <div class="row">
        <div>
          <div class="label">校務 / eeclass 自動登入</div>
          <div class="desc">填好帳密與驗證碼後自動送出</div>
        </div>
        <label class="switch" aria-label="校務 / eeclass 自動登入">
          <input type="checkbox" id="autoLoginToggle">
          <span class="slider"></span>
        </label>
      </div>

      <div id="loginDetails" hidden>
        <div class="saved" id="savedSummary" hidden>
          <span>已儲存<span class="saved-account" id="savedAccountLabel"></span></span>
          <button type="button" class="link" id="editLoginBtn">編輯</button>
        </div>

        <div class="form" id="loginForm" hidden>
          <div class="field">
            <label for="savedAccount">學號</label>
            <input type="text" id="savedAccount" class="input" placeholder="例如 112062001" autocomplete="off" spellcheck="false">
          </div>
          <div class="field">
            <label for="savedPassword">校務系統密碼</label>
            <div class="password-wrapper">
              <input type="password" id="savedPassword" class="input" autocomplete="off" spellcheck="false">
              <button type="button" class="eye-btn" id="togglePasswordBtn" title="顯示密碼" aria-label="顯示密碼">
                <svg id="eyeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn-outline" id="saveLoginBtn">儲存</button>
            <div class="secondary">
              <button type="button" class="link" id="cancelEditBtn" hidden>取消</button>
              <button type="button" class="link danger" id="clearLoginBtn">清除帳密</button>
            </div>
          </div>
        </div>

        <div class="status" id="loginStatusMessage" role="status"></div>
        <div class="note">帳密只存在這台電腦的瀏覽器裡，不會上傳。</div>
      </div>
    </section>

    <button type="button" class="btn-primary" id="forceRecognizeBtn">重新辨識這個頁面</button>
    <div class="status" id="statusMessage" role="status"></div>

    <footer class="foot">
      <span id="versionTag">v1.3.5</span>
      <button type="button" class="link" id="restartOcrBtn">辨識沒反應？重新啟動</button>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
